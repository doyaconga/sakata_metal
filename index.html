<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>坂田さんのメロディックスピードメタル</title>
<link rel="stylesheet" href="styles.css"></head>
<body class="titleOnly">

<div id="titleScreen">
  <div id="titleFaces" aria-hidden="true">
  </div>
  <div id="titleBottom">
    <div id="gameTitle">坂田さんのメロディックスピードメタル</div>
    <div id="titleButtons">
      <button id="startBtn" type="button">スタート</button>
      <button id="scoreBtn" type="button">ランキング</button>
      <button id="recordBtn" type="button">プレイ記録</button>
    </div>
    <button id="debugBtn" class="hidden" type="button">DEBUG</button>
  </div>
  <div id="titleDemoWrap" aria-label="操作方法の自動デモ">
    <canvas id="titleDemo" width="720" height="300"></canvas>
  </div>
</div>
<div id="scoreModal" class="hidden">
  <div id="scorePanel">
    <div id="scoreTitle">TOTAL SCORE TOP 10</div>
    <div id="scoreList"></div>
    <button id="scoreClose" type="button">BACK</button>
  </div>
</div>
<div id="recordModal" class="hidden">
  <div id="recordPanel">
    <div id="recordTitle">プレイ記録</div>
    <div id="recordStats"></div>
    <div id="deathTitle">坂田さんの死因ベスト3</div>
    <div id="deathList"></div>
    <button id="recordClose" type="button">戻る</button>
  </div>
</div>
<div id="debugModal" class="hidden">
  <div id="debugPanel">
    <div id="debugTitle">DEBUG SETTINGS</div>
    <div id="debugNote">開発用・変更した数値は自動保存され、次のSTARTから反映</div>
    <div id="debugFields"></div>
    <div id="debugAnimalSection">
      <div id="debugAnimalTitle">出現する動物</div>
      <div id="debugAnimalChecks"></div>
      <div id="debugAnimalButtons">
        <button id="debugAnimalsAll" type="button">すべて選択</button>
        <button id="debugAnimalsNone" type="button">すべて外す</button>
      </div>
    </div>
    <div id="debugActions">
      <button id="debugApply" type="button">適用して保存</button>
      <button id="debugReset" type="button">初期値に戻す</button>
      <button id="debugClose" type="button">閉じる</button>
    </div>
    <div id="debugStatus" role="status" aria-live="polite"></div>
  </div>
</div>
<div id="gameShell">
<div id="wrap"><canvas id="game" width="960" height="540"></canvas>
<div id="ui"><div id="score"><span id="scoreLabel">TOTAL SCORE</span><span id="scoreValue">0</span><span id="scoreGain" aria-live="polite"></span></div><div id="sub"></div><div id="meatHud"></div><div id="banner"></div>
<div id="cycloneMeter" role="status" aria-label="坂田メロディックスピードメタル 0 / 5">
  <div id="cycloneMeterLabel">MELODIC SPEED METAL</div>
  <div id="cycloneSlots"></div>
</div>
<button id="pauseBtn" type="button" aria-label="ゲームを一時停止">Ⅱ</button>
<div id="cycloneOverlay" class="hidden" aria-live="polite">
  <div id="cycloneCutin">
    <img src="assets/sakata.png" alt="">
    <div><span>SAKATA MELODIC</span><strong>SPEED METAL</strong></div>
  </div>
  <div id="cycloneCountdown" class="hidden"></div>
</div>
<div id="lariatWrap"><button id="lariatBtn" type="button">
  <span id="lariatLabel">坂田モッシュ</span>
  <span id="lariatGauge"><span id="lariatFill"></span></span>
  <span id="activeGauge"><span id="activeFill"></span></span>
  <span id="lariatStatus">READY</span>
</button></div>
<div id="msg" class="hidden">
  <div id="panel">
    <div id="gameOverContent"></div>
    <div id="gameOverButtons">
      <div id="gameOverMainButtons">
        <button id="retryBtn" type="button">リトライ</button>
        <button id="gameOverScoreBtn" type="button">ランキング</button>
      </div>
      <button id="titleReturnBtn" type="button">タイトルへ戻る</button>
    </div>
  </div>
</div></div></div></div>
<div id="pauseOverlay" class="hidden" role="dialog" aria-modal="true" aria-labelledby="pauseTitle">
  <div id="pausePanel">
    <div id="pauseMenu">
      <div id="pauseTitle">PAUSE</div>
      <div id="pauseButtons">
        <button id="pauseResumeBtn" type="button">ゲームを再開</button>
        <button id="pauseScoreBtn" type="button">ランキング</button>
        <button id="pauseRestartBtn" type="button">リスタート</button>
        <button id="pauseTitleBtn" type="button">タイトルへ戻る</button>
      </div>
      <div id="pauseHint">Escキーでも再開できます</div>
    </div>
    <div id="pauseConfirm" class="hidden">
      <div id="pauseConfirmTitle"></div>
      <div id="pauseConfirmText"></div>
      <div id="pauseConfirmButtons">
        <button id="pauseConfirmCancel" type="button">キャンセル</button>
        <button id="pauseConfirmOk" type="button"></button>
      </div>
    </div>
  </div>
</div>
</div>
<script src="audio.js"></script>
<script src="config.js"></script>
<script src="title.js"></script>
<script src="rendering.js"></script>
<script src="game.js"></script></body></html>
