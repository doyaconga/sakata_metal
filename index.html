*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:system-ui,sans-serif}
body{display:grid;place-items:center}#wrap{position:relative;width:min(100vw,960px);aspect-ratio:16/9;max-height:100vh;overflow:hidden;touch-action:none}
canvas{width:100%;height:100%;display:block}#ui{position:absolute;inset:0;pointer-events:none;color:white;text-shadow:2px 2px #000}
#score{position:absolute;left:18px;top:14px;font-size:24px;font-weight:950}#sub{position:absolute;left:18px;top:47px;font-size:13px;line-height:1.35;font-weight:800}
#help{position:absolute;right:18px;top:16px;font-size:14px}#banner{position:absolute;left:50%;top:27%;transform:translate(-50%,-50%);font-size:40px;font-weight:950;opacity:0;transition:opacity .2s;text-align:center}
#banner.show{opacity:1}#msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:800}.hidden{display:none!important}
#panel{background:#000a;padding:25px 35px;border-radius:16px}#panel b{display:block;font-size:32px;margin-bottom:8px}
#lariatWrap{position:absolute;right:18px;bottom:18px;pointer-events:auto}
#lariatBtn{
  position:relative;
  border:2px solid #fff;
  background:#7a2020;
  color:#fff;
  font-weight:900;
  font-size:15px;
  padding:9px 13px 10px;
  border-radius:10px;
  box-shadow:0 2px 0 #3d0d0d;
  cursor:pointer;
  min-width:175px;
}
#lariatLabel{display:block}
#lariatGauge{display:block;height:7px;margin-top:7px;background:#3a1111;border-radius:99px;overflow:hidden}
#lariatFill{display:block;width:100%;height:100%;background:#eee;transform-origin:left center;transform:scaleX(1)}
#activeGauge{display:none;height:7px;margin-top:5px;background:#2a0b0b;border-radius:99px;overflow:hidden}
#activeFill{display:block;width:100%;height:100%;background:#f2c94c;transform-origin:left center;transform:scaleX(1)}
#lariatBtn.activeNow #activeGauge{display:block}
#lariatBtn.activeNow #lariatGauge{display:none}

#lariatStatus{display:block;margin-top:4px;font-size:10px;letter-spacing:1px;color:#ddd}
#lariatBurst{display:none}
#lariatBtn:disabled{opacity:.65;cursor:default;box-shadow:none}

#scoreModal{
  position:absolute;inset:0;z-index:200;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.72);
}
#scoreModal.hidden{display:none}
#scorePanel{
  width:min(420px,84%);padding:24px 28px;
  background:#f5efe3;border:4px solid #2b211b;border-radius:16px;
  text-align:center;
}
#scoreTitle{font-size:30px;font-weight:1000;margin-bottom:15px}
#scoreList{
  width:min(300px,100%);
  margin:0 auto 18px;
  text-align:left;
  font-size:18px;
  font-weight:800;
  line-height:1.55;
}

#scoreClose{width:160px;font-size:16px}
.scoreRow{display:flex;justify-content:space-between;gap:16px;padding:4px 8px;border-bottom:1px solid #cdbfae}
.scoreRank{min-width:42px}
.scoreValue{font-variant-numeric:tabular-nums}
.scoreValue small{display:block;font-size:11px;color:#6b5a48;font-weight:800;margin-top:2px}


.hiddenGame{display:none!important}
#gameShell{width:100%;height:100%}

}

#panel{pointer-events:auto}

  display:flex!important;

}
body.titleOnly 


#gameOverButtons{
  display:flex;
  flex-direction:row;
  flex-wrap:nowrap;
  justify-content:center;
  align-items:center;
  gap:12px;
  width:100%;
  margin:20px auto 0;
  pointer-events:auto;
}
#retryBtn,#titleReturnBtn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  margin:0;
  padding:11px 14px;
  width:170px;
  min-width:0;
  box-sizing:border-box;
  border:3px solid #fff;
  border-radius:12px;
  color:#fff;
  font-size:16px;
  font-weight:1000;
  cursor:pointer;
  pointer-events:auto;
  white-space:nowrap;
}
#retryBtn{
  background:#35652f;
  box-shadow:0 3px 0 #173b14;
}
#titleReturnBtn{
  background:#7a2020;
  box-shadow:0 3px 0 #3b0c0c;
}


#titleScreen{
  position:fixed;
  inset:0;
  z-index:1000;
  display:flex;
  flex-direction:column;
  background:#111;
}

#titleBottom{
  position:relative;
  z-index:5;
  pointer-events:auto;
  flex:0 0 auto;
  background:#f3eadb;
  border-top:4px solid #2f241c;
  padding:16px 16px 18px;
  text-align:center;
}
#gameTitle{
  color:#742020;
  font-size:30px;
  font-weight:1000;
  line-height:1.1;
  margin-bottom:14px;
  text-shadow:2px 2px 0 #fff;
}
#titleButtons{
  display:flex;
  justify-content:center;
  gap:16px;
}
#startBtn,#scoreBtn{
  width:190px;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
  pointer-events:auto;
  padding:12px 18px;
  border:3px solid #f4e4bf;
  border-radius:10px;
  color:#fff;
  font-size:20px;
  font-weight:1000;
  cursor:pointer;
}
#startBtn{background:#9d211d;box-shadow:0 3px 0 #4b0d0b}
#scoreBtn{background:#315271;box-shadow:0 3px 0 #172b3c}
body.titleOnly #titleScreen{display:flex!important}
body.gameOnly #titleScreen{display:none!important}
body.titleOnly #gameShell{display:none!important}
body.gameOnly #gameShell{display:block!important}

#titleFaces{
  position:relative;
  pointer-events:none;
  flex:1 1 auto;
  min-height:0;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 42%,rgba(255,255,255,.18),transparent 34%),
    linear-gradient(180deg,#78bceb 0%,#b8ddf5 55%,#d7b078 56%,#8c5b36 100%);
}
#titleFaces::before{
  content:"";
  position:absolute;left:0;right:0;bottom:0;height:34%;
  background:
    linear-gradient(180deg,rgba(61,116,65,.95) 0 18%,rgba(79,132,70,.95) 19% 28%,transparent 29%),
    repeating-linear-gradient(90deg,transparent 0 110px,rgba(255,255,255,.08) 111px 112px);
}
#titleFaces .face{
  position:absolute;
  width:120px;height:120px;
  object-fit:contain;
  filter:drop-shadow(0 4px 0 rgba(0,0,0,.35));
  transform-origin:center;
}
#titleFaces .f1{left:7%;top:12%;transform:rotate(-12deg) scale(1.05)}
#titleFaces .f2{right:8%;top:10%;transform:rotate(11deg) scale(.95)}
#titleFaces .f3{left:20%;bottom:10%;transform:rotate(7deg) scale(.82)}
#titleFaces .f4{right:21%;bottom:9%;transform:rotate(-8deg) scale(.86)}
#titleFaces .f5{left:50%;top:43%;transform:translate(-50%,-50%) scale(1.45)}
#titleFaces .f6{left:50%;bottom:-16px;transform:translateX(-50%) rotate(4deg) scale(.72)}

<script>

// ---------- SOUND ----------
let audioCtx=null;
let masterGain=null;
let noiseBuffer=null;

function initAudio(){
  if(!audioCtx){
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    audioCtx=new AC();
    masterGain=audioCtx.createGain();
    masterGain.gain.value=.34;
    masterGain.connect(audioCtx.destination);

    noiseBuffer=audioCtx.createBuffer(1,audioCtx.sampleRate*2,audioCtx.sampleRate);
    const d=noiseBuffer.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }
  if(audioCtx.state==='suspended')audioCtx.resume();
}
function tone(freq,dur=.12,type='square',vol=.18,endFreq=null,delay=0){
  if(!audioCtx)return;
  const t=audioCtx.currentTime+delay;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);
  if(endFreq)o.frequency.exponentialRampToValueAtTime(Math.max(20,endFreq),t+dur);
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(Math.max(.0002,vol),t+.008);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(masterGain);o.start(t);o.stop(t+dur+.02);
}
function noise(dur=.18,vol=.18,lowpass=1000,delay=0){
  if(!audioCtx||!noiseBuffer)return;
  const t=audioCtx.currentTime+delay;
  const n=audioCtx.createBufferSource(),f=audioCtx.createBiquadFilter(),g=audioCtx.createGain();
  n.buffer=noiseBuffer;f.type='lowpass';f.frequency.value=lowpass;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  n.connect(f);f.connect(g);g.connect(masterGain);n.start(t);n.stop(t+dur+.02);
}
function sfxJump(){
  initAudio();
  if(!audioCtx)return;
  // Clearly audible arcade jump: quick rising chirp with a soft low layer.
  tone(180,.13,'square',.28,430);
  tone(390,.15,'sine',.24,820,.025);
  tone(105,.10,'triangle',.14,155);
}
function sfxStart(){
  initAudio();tone(330,.08,'square',.10,440);tone(440,.08,'square',.10,660,.08);tone(660,.12,'square',.12,880,.16);
}
function sfxLariat(){
  initAudio();noise(.32,.24,520);tone(105,.38,'sawtooth',.22,48);tone(62,.48,'square',.13,35);
}
function sfxHit(){
  initAudio();noise(.12,.25,700);tone(120,.13,'square',.16,55);
}

function sfxDamage(){
  initAudio();
  // Heavy body-impact thump.
  noise(.24,.34,430);
  tone(92,.28,'sawtooth',.30,38);
  tone(54,.34,'square',.22,27,.025);
  // Small second impact gives it more weight.
  noise(.13,.18,260,.075);
  tone(145,.12,'square',.13,60,.07);
}

function sfxThunder(){
  initAudio();noise(.65,.20,380);tone(58,.7,'sawtooth',.12,28);
}
function sfxGameOver(){
  initAudio();
  tone(330,.18,'square',.12,250);
  tone(245,.22,'square',.12,180,.19);
  tone(165,.42,'sawtooth',.14,70,.42);
}
function sfxStage(){
  initAudio();tone(440,.08,'square',.08,550);tone(550,.08,'square',.09,700,.08);tone(700,.18,'square',.11,950,.16);
}
function sfxButton(){
  initAudio();tone(520,.055,'square',.07,650);
}

// ---------- PROCEDURAL BGM ----------
let bgmMode='none';
let bgmTimer=null;
let bgmStep=0;
let bgmGain=null;

function ensureBgmGain(){
  initAudio();
  if(!audioCtx)return false;
  if(!bgmGain){
    bgmGain=audioCtx.createGain();
    bgmGain.gain.value=.62;
    bgmGain.connect(masterGain);
  }
  return true;
}

function bgmTone(freq,dur=.16,type='triangle',vol=.16,delay=0){
  if(!audioCtx||!bgmGain)return;
  const t=audioCtx.currentTime+delay;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;
  o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(Math.max(.0002,vol),t+.008);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(bgmGain);
  o.start(t);o.stop(t+dur+.03);
}
function bgmNoise(dur=.08,vol=.10,lowpass=1700,delay=0){
  if(!audioCtx||!bgmGain||!noiseBuffer)return;
  const t=audioCtx.currentTime+delay;
  const n=audioCtx.createBufferSource(),f=audioCtx.createBiquadFilter(),g=audioCtx.createGain();
  n.buffer=noiseBuffer;
  f.type='lowpass';f.frequency.value=lowpass;
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  n.connect(f);f.connect(g);g.connect(bgmGain);
  n.start(t);n.stop(t+dur+.02);
}

function stopBgm(){
  if(bgmTimer){clearInterval(bgmTimer);bgmTimer=null;}
  bgmMode='none';bgmStep=0;
}

function startBgm(mode){
  if(!ensureBgmGain())return;
  if(bgmMode===mode && bgmTimer)return;
  if(bgmTimer)clearInterval(bgmTimer);
  bgmMode=mode;
  bgmStep=0;

  const interval = mode==='title' ? 310 : mode==='game' ? 145 : 72;
  bgmTimer=setInterval(()=>{
    if(!audioCtx||audioCtx.state!=='running')return;

    if(bgmMode==='title'){
      // Gentle major-key arpeggio / toy-box feel.
      const notes=[261.63,329.63,392.00,523.25,392.00,329.63,293.66,349.23];
      const bass=[130.81,130.81,146.83,146.83,174.61,174.61,146.83,146.83];
      const i=bgmStep%notes.length;
      bgmTone(notes[i],.25,'triangle',.15);
      if(i%2===0)bgmTone(bass[i],.36,'sine',.07);
      if(i===0||i===4)bgmTone(notes[i]/2,.50,'sine',.045,.02);

    }else if(bgmMode==='game'){
      // Fast driving pulse with simple minor melody.
      const melody=[329.63,392.00,440.00,392.00,329.63,293.66,329.63,493.88,
                    440.00,392.00,329.63,293.66,261.63,293.66,329.63,392.00];
      const i=bgmStep%melody.length;
      bgmTone(melody[i],.11,'square',.12);
      bgmTone(i%4===0?110:82.41,.12,'sawtooth',i%4===0?.095:.045);
      if(i%2===0)bgmNoise(.035,.055,2400);
      if(i%4===2)bgmNoise(.055,.07,900);

    }else if(bgmMode==='lariat'){
      // Deliberately excessive: pounding lows, dissonant stabs, metallic noise,
      // siren-like alternation and rapid percussion.
      const i=bgmStep%16;
      const stabs=[110,155.56,92.50,174.61,116.54,87.31,196,103.83];

      // Heavy low-end pulse every step.
      bgmTone(i%2===0?46.25:55,.20,'square',.25,0);
      bgmTone(70,.16,'sawtooth',.18,0);

      // Dissonant upper stabs.
      bgmTone(stabs[i%stabs.length],.12,'sawtooth',.23,0);
      bgmTone(stabs[(i+3)%stabs.length]*1.5,.08,'square',.12,.018);

      // Constant crash/noise percussion.
      bgmNoise(.085,i%2===0?.25:.18,i%4===0?480:2600);
      if(i%2===0)bgmNoise(.045,.14,5200,.035);

      // Alarm / siren feel.
      if(i%4===0 || i%4===2){
        const siren=i%4===0?520:760;
        bgmTone(siren,.16,'square',.16,i%4===0?760:520,0);
      }

      // Big crash on the beat.
      if(i%4===0){
        bgmTone(220,.13,'square',.20,0);
        bgmTone(440,.10,'square',.14,.025);
        bgmTone(880,.07,'square',.08,.05);
        bgmNoise(.16,.28,900,0);
      }
    }
    bgmStep++;
  },interval);
}

function getScores(){
  try{
    const a=JSON.parse(localStorage.getItem('zangiefAnimalTop10V2')||'[]');
    return Array.isArray(a)?a.filter(r=>r&&Number.isFinite(r.totalScore)).sort((a,b)=>b.totalScore-a.totalScore).slice(0,10):[];
  }catch(e){return []}
}
function saveScoreRecord(record){
  if(!record||!Number.isFinite(record.totalScore)||record.totalScore<=0)return;
  const a=getScores();
  a.push(record);
  a.sort((a,b)=>b.totalScore-a.totalScore);
  localStorage.setItem('zangiefAnimalTop10V2',JSON.stringify(a.slice(0,10)));
}
function showScores(){
  const list=document.querySelector('#scoreList');
  const scores=getScores();
  list.innerHTML='';
  if(scores.length===0){
    const row=document.createElement('div');
    row.className='scoreRow';
    row.innerHTML='<span class="scoreRank">-</span><span class="scoreValue">まだ記録なし</span>';
    list.appendChild(row);
  }else{
    scores.forEach((r,i)=>{
      const row=document.createElement('div');
      row.className='scoreRow';
      row.innerHTML='<span class="scoreRank">'+(i+1)+'.</span><span class="scoreValue">'+fmt(r.totalScore)+'<small>　'+r.distance+'m / +'+fmt(r.bonus)+'</small></span>';
      list.appendChild(row);
    });
  }
  document.querySelector('#scoreModal').classList.remove('hidden');
}
function fmt(v){return Math.floor(v).toLocaleString('ja-JP')}

  document.body.classList.add('titleOnly');
  startBgm('title');
});


document.querySelector('#retryBtn').addEventListener('pointerdown',e=>{
  e.preventDefault();
  e.stopPropagation();initAudio();sfxStart();startBgm('game');

  const msg=document.querySelector('#msg');
  if(msg)msg.classList.add('hidden');

  titleMode=false;
  document.body.classList.remove('titleOnly');
  document.body.classList.add('gameOnly');
  reset();
});

document.addEventListener('pointerdown',()=>{
  initAudio();
  if(titleMode)startBgm('title');
},{once:true});
document.addEventListener('keydown',initAudio,{once:true});
document.addEventListener('keydown',e=>{
  if(e.code!=='KeyD' || e.repeat)return;
  debugHitboxes=!debugHitboxes;
  if(!run)draw();
});
</script></body></html>
